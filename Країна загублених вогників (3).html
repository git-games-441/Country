<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Країна загублених вогників</title>
<style>
:root{--bg:#10170f;--ink:#fff3c4;--gold:#ffd54a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Neue","Trebuchet MS",system-ui,sans-serif}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tabs button{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:#2a3a22;border:2px solid #5b7a3a;border-radius:20px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--gold);color:#3a2a00;border-color:#fff3c4}
#stage{position:relative;width:min(100%,calc((100vh - 110px)*1.4156));aspect-ratio:1492/1054;border-radius:16px;overflow:hidden;box-shadow:0 0 30px #ffd54a55}
#stage>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.st{position:absolute;width:26%;height:26%;transform:translate(-50%,-50%);background:transparent;border:0;border-radius:40%;cursor:pointer}
.st:focus-visible{outline:3px solid var(--gold)}
.st.next::after{content:"";position:absolute;inset:6%;border-radius:40%;border:3px solid #fff8;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.12);opacity:0}}
.st .ok{position:absolute;left:6%;top:6%;width:clamp(18px,3.4vw,40px);aspect-ratio:1;border-radius:50%;background:var(--gold);color:#4a3200;font-weight:900;display:none;align-items:center;justify-content:center;font-size:clamp(12px,2.4vw,26px);box-shadow:0 0 14px #fff}
.st.done .ok{display:flex}
#ff{position:absolute;left:0;top:0;width:13%;pointer-events:none;z-index:5;filter:drop-shadow(0 0 12px #ffe066)}
#ff img{width:100%;display:block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6%) rotate(2deg)}}
.sp{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff6a8;box-shadow:0 0 10px 3px #ffd54a;pointer-events:none;z-index:4;animation:fade 1s forwards}
@keyframes fade{to{opacity:0;transform:translateY(14px) scale(.2)}}
#cap{min-height:64px;max-width:760px;text-align:center;font-size:clamp(17px,3.6vw,24px);line-height:1.3;padding:4px 10px}
#cap b{color:var(--gold);display:block;font-size:1.15em}
#win{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#000a;text-align:center;font-size:clamp(20px,5vw,40px);font-weight:700;padding:16px}
#win.show{display:flex}
#win button{font:inherit;font-size:.6em;background:var(--gold);color:#3a2a00;border:0;border-radius:24px;padding:8px 22px;cursor:pointer}
@media(prefers-reduced-motion:reduce){#ff img,.st.next::after{animation:none}}
</style>
</head>

1:[["Добре серце",25,28],["Спокійний розум",73,27],["Радісний настрій",76,58],["Вдячне серце",38,68],["Впевнені кроки",72,86]],
2:[["Спокійний розум",25,28],["Радісний настрій",75,28],["Добре серце",52,57],["Вдячне серце",25,75],["Впевнені кроки",74,80]],
3:[["Вдячне серце",27,28],["Спокійний розум",76,27],["Добре серце",52,55],["Радісний настрій",27,76],["Впевнені кроки",74,76]],
4:[["Радісний настрій",22,28],["Спокійний розум",73,26],["Добре серце",52,54],["Впевнені кроки",24,73],["Вдячне серце",74,76]],
5:[["Впевнені кроки",24,28],["Добре серце",74,28],["Вдячне серце",52,56],["Спокійний розум",28,76],["Радісний настрій",74,76]]
};
const stage=document.getElementById('stage'),ff=document.getElementById('ff'),cap=document.getElementById('cap'),win=document.getElementById('win'),bg=document.getElementById('bg');
let sheet=1,done=new Set(),pos=[5,50],busy=false;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function place(p){const w=stage.clientWidth,h=stage.clientHeight;ff.style.transform=`translate(${p[0]/100*w-ff.offsetWidth/2}px,${p[1]/100*h-ff.offsetHeight*0.55}px)`}
function spark(p){const s=document.createElement('i');s.className='sp';s.style.left=p[0]+'%';s.style.top=p[1]+'%';s.style.marginLeft=(Math.random()*20-10)+'px';stage.appendChild(s);setTimeout(()=>s.remove(),1000)}
function build(n){
  sheet=n;done=new Set();pos=[5,50];busy=false;win.classList.remove('show');
  bg.src=BG[n];stage.querySelectorAll('.st').forEach(e=>e.remove());
  L[n].forEach((s,i)=>{const b=document.createElement('button');b.className='st';b.style.left=s[1]+'%';b.style.top=s[2]+'%';b.setAttribute('aria-label',s[0]);
    b.innerHTML='<span class="ok">✓</span>';b.onclick=()=>go(i);stage.appendChild(b)});
  cap.innerHTML='Торкнись станції — Світлик полетить туди!';
  mark();place(pos);
}
function mark(){const bs=stage.querySelectorAll('.st');let nx=[...bs].findIndex((_,i)=>!done.has(i));bs.forEach((b,i)=>{b.classList.toggle('done',done.has(i));b.classList.toggle('next',i===nx)})}
function go(i){
  if(busy)return;busy=true;
  const t=[L[sheet][i][1],L[sheet][i][2]-3],a=pos.slice(),dur=reduce?1:1500;
  const c=[(a[0]+t[0])/2,Math.min(a[1],t[1])-14],t0=performance.now();
  (function f(now){
    let k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,m=1-e;
    const p=[m*m*a[0]+2*m*e*c[0]+e*e*t[0],m*m*a[1]+2*m*e*c[1]+e*e*t[1]];
    place(p);if(!reduce&&Math.random()<.55)spark(p);
    if(k<1)requestAnimationFrame(f);else{pos=t;arrive(i)}
  })(t0);
}
function arrive(i){
  busy=false;done.add(i);mark();
  cap.innerHTML='<b>'+(i+1)+'. '+L[sheet][i][0]+'</b>'+T[L[sheet][i][0]];
  if(done.size===5)setTimeout(()=>win.classList.add('show'),1200);
}
document.getElementById('again').onclick=()=>build(sheet);
addEventListener('resize',()=>place(pos));
bg.onload=()=>place(pos);
build(1);
</script>
</body>
</html>
